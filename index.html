<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Disk Label · Cine UDD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..800&family=Libre+Franklin:wght@300..700&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#204c8e;--panel:#183d75;--panel2:#13325f;--line:#2c5a9c;--line2:#3a69ad;--fg:#fff;--muted:#b3c7e6;--dim:#86a2cc;--ink2:#e6eefa;--track:#2d5a99;--acc:#e0583f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Libre Franklin',system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--panel2)}
.top img{height:20px;display:block}.top b{font:600 17px 'Space Grotesk',sans-serif}
main{max-width:680px;margin:0 auto;padding:22px 18px 40px}
.id{font:800 54px/.9 'Outfit',sans-serif;letter-spacing:-.02em;margin:0}
.nom{font:700 22px/1.15 'Outfit',sans-serif;text-transform:uppercase;margin:6px 0 0}
.cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;font:600 20px 'Outfit',sans-serif}
.cap span{font:400 14px 'Libre Franklin';color:var(--muted)}
.bar{height:6px;background:var(--track);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:3px}.bar i.lleno{background:var(--acc)}
.cont{font-size:16px;line-height:1.5;color:var(--ink2);margin:18px 0 0;white-space:pre-line}
.datos{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13.5px;color:var(--muted)}.datos b{color:#fff;font-weight:600}
.est{display:inline-block;margin-top:14px;font-size:12px;padding:4px 9px;border:1px solid var(--line2);border-radius:20px;color:var(--ink2)}
h2{font:600 12px 'Outfit',sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:30px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 button{all:unset;cursor:pointer;font:400 12px 'Libre Franklin';letter-spacing:0;text-transform:none;color:var(--muted);margin-left:14px;text-decoration:underline}
.caja{background:var(--panel);border-radius:10px;padding:10px 12px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td{padding:4px 0;font-size:14px;vertical-align:middle}
td.s{width:74px;text-align:right;color:var(--muted);font-size:12.5px;white-space:nowrap}
td.q{width:64px;text-align:right;color:var(--dim);font-size:11.5px;white-space:nowrap;padding-right:8px}
td.n{overflow:hidden;white-space:nowrap}
tr.oc{display:none}
.tg{all:unset;display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:3px 4px;border-radius:5px;-webkit-tap-highlight-color:transparent}
button.tg{cursor:pointer}button.tg:active{background:rgba(255,255,255,.08)}
.tg>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:17px;height:17px;flex:none;fill:none;stroke:#9fc0ee;stroke-width:1.3;stroke-linejoin:round}
.car{width:10px;flex:none;display:inline-block;color:var(--muted)}
.car::before{content:"";display:block;width:0;height:0;border:4.5px solid transparent;border-left:6px solid currentColor;border-right:0;margin-left:2px;transition:transform .12s}
tr.ab .car::before{transform:rotate(90deg)}.car.v::before{border-left-color:transparent}
tr.r0 td.n{font-weight:600}
.tip td{padding:6px 0}.tip td.e{width:64px;font:600 14px 'Outfit'}.tip td.g{padding-right:10px}.tip td.g i{display:block;height:4px;border-radius:2px;background:#fff;min-width:3px}
.tip td.g{background:linear-gradient(var(--track),var(--track)) left center/calc(100% - 10px) 4px no-repeat}
.btn{display:block;text-align:center;margin-top:28px;background:#fff;color:var(--bg);text-decoration:none;font:700 16px 'Outfit';padding:14px;border-radius:8px}
.nota{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.pie{text-align:center;margin-top:28px;font-size:13px}.pie a{color:var(--muted)}
.msg{color:var(--muted);font-size:16px;line-height:1.5}
.buscar{width:100%;font:16px 'Libre Franklin';color:#fff;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:12px 14px;margin:18px 0 6px}
.buscar::placeholder{color:var(--dim)}
.lista a{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:14px 2px;border-top:1px solid var(--line);text-decoration:none}
.lista a:first-child{border-top:0}
.lista .i{font:700 17px 'Outfit'}.lista .t{min-width:0}.lista .t b{display:block;font:600 15px 'Outfit';text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista .t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lista .c{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.h1{font:800 30px/1 'Outfit';text-transform:uppercase;margin:6px 0 0}
</style>
</head>

<script>
/* Carpeta FICHAS en OneDrive (ficha PDF completa, solo con cuenta UDD). */
var FICHAS='https://uddcl-my.sharepoint.com/personal/fazuac_udd_cl/Documents/DISCOS%20DUROS%20CARRERA/Archivos%20discos/FICHAS';
var ICO_C='<svg class="ico" viewBox="0 0 16 16"><path d="M1.5 3.5h4.2l1.4 1.6h7.4v7.9h-13z"/></svg>',ICO_A='<svg class="ico" viewBox="0 0 16 16"><path d="M1.5 13V3.5h4.2l1.4 1.6h6.4v2"/><path d="M1.5 13l2.2-5.9h11l-2.2 5.9z"/></svg>';
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(b){var o=function(x,d){return x.toLocaleString('es-CL',{minimumFractionDigits:d,maximumFractionDigits:d})};if(b>=1e12)return o(b/1e12,2)+' TB';if(b>=1e9)return o(b/1e9,1)+' GB';if(b>=1e6)return o(b/1e6,0)+' MB';return o(b/1e3,0)+' KB'}
function gb(g){g=+g;return g>=1000?(g/1000).toLocaleString('es-CL',{maximumFractionDigits:2})+' TB':Math.round(g).toLocaleString('es-CL')+' GB'}
function mes(t){var d=new Date(t);return MES[d.getMonth()]+' '+d.getFullYear()}
function idDe(q){var m=String(q||'').match(/(\d+)/);return m?'HD-'+('00'+parseInt(m[1],10)).slice(-3):''}
function pdf(id){return FICHAS+'/'+id+'_ficha.pdf'}
async function json(u){var r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json()}
var ABIERTO={0:true};
function arbol(o){
  var a=o.arbol||[],h='<tr class="r0 ab" data-i="0" data-l="0"><td class="n"><button class="tg">'+ICO_A+'<span>'+esc(o.root||o.nombre||o.id)+'</span></button></td><td class="q">'+(o.n?o.n.toLocaleString('es-CL')+' arch.':'')+'</td><td class="s">'+(o.tot?fmt(o.tot):'')+'</td></tr>';
  if(o.raiz>0)h+='<tr data-l="1"><td class="n" style="padding-left:18px"><span class="tg"><span>Archivos sueltos en la raíz</span></span></td><td class="q"></td><td class="s">'+fmt(o.raiz)+'</td></tr>';
  a.forEach(function(x,k){var hj=k+1<a.length&&a[k+1][0]>x[0];
    h+='<tr data-i="'+(k+1)+'" data-l="'+x[0]+'"'+(hj?' class="p"':'')+'><td class="n" style="padding-left:'+(x[0]*14)+'px">'+(hj?'<button class="tg"><i class="car"></i>'+ICO_C:'<span class="tg"><i class="car v"></i>'+ICO_C)+'<span>'+esc(x[1])+'</span>'+(hj?'</button>':'</span>')+'</td><td class="q">'+(x[3]?x[3].toLocaleString('es-CL')+' arch.':'')+'</td><td class="s">'+fmt(x[2])+'</td></tr>'});
  return h;
}
function visibles(){var vis=[true];document.querySelectorAll('#arb tr').forEach(function(r){var l=+r.dataset.l,ok=l===0||vis[l-1]===true;r.classList.toggle('oc',!ok);var i=r.dataset.i,ab=i!=null&&!!ABIERTO[i];vis[l]=ok&&ab;vis.length=l+1;r.classList.toggle('ab',ab);var ic=r.querySelector('button.tg .ico');if(ic&&l>0)ic.outerHTML=ab?ICO_A:ICO_C})}
function disco(o){
  document.title=o.id+' · '+(o.nombre||'Disk Label');
  var t=+o.total||0,d=o.disp===''||o.disp==null?NaN:+o.disp,pc=t>0&&!isNaN(d)?Math.max(0,Math.min(100,(t-d)/t*100)):-1;
  var mx=(o.tipos||[]).reduce(function(m,x){return Math.max(m,x[1])},0);
  var h='<p class="id">'+esc(o.id)+'</p><p class="nom">'+esc(o.nombre||'')+'</p>'+
    (t?'<div class="cap">'+gb(t)+(isNaN(d)?'':'<span>'+gb(d)+' libres</span>')+'</div>'+(pc>=0?'<div class="bar"><i'+(pc>75?' class="lleno"':'')+' style="width:'+pc.toFixed(1)+'%"></i></div>':''):'')+
    (o.contenido?'<p class="cont">'+esc(o.contenido)+'</p>':'')+
    '<div class="datos">'+(o.n?'<span><b>'+o.n.toLocaleString('es-CL')+'</b> archivos</span>':'')+(o.min?'<span>Fechas: <b>'+mes(o.min)+' – '+mes(o.max)+'</b></span>':'')+'</div>'+
    (o.estado?'<span class="est">'+esc(o.estado)+'</span>':'')+
    ((o.arbol&&o.arbol.length)||o.raiz?'<h2>Carpetas <span><button id="abT">Abrir todo</button><button id="ceT">Cerrar todo</button></span></h2><div class="caja"><table id="arb">'+arbol(o)+'</table></div>':'')+
    ((o.tipos&&o.tipos.length)?'<h2>Material por tipo</h2><div class="caja"><table class="tip">'+o.tipos.slice(0,10).map(function(x){return '<tr><td class="e">.'+esc(x[0])+'</td><td class="g"><i style="width:'+(x[1]/mx*100).toFixed(1)+'%"></i></td><td class="s">'+fmt(x[1])+'</td></tr>'}).join('')+'</table></div>':'')+
    '<a class="btn" href="'+pdf(o.id)+'">Abrir ficha completa (PDF)</a><p class="nota">La ficha PDF se abre con cuenta UDD.</p>'+
    '<p class="pie"><a href="./">Ver todos los discos</a></p>';
  $('m').innerHTML=h;
  if($('arb')){visibles();$('arb').addEventListener('click',function(e){var b=e.target.closest('button.tg');if(!b)return;var i=b.closest('tr').dataset.i;ABIERTO[i]=!ABIERTO[i];visibles()});
    $('abT').onclick=function(){document.querySelectorAll('#arb tr[data-i]').forEach(function(r){ABIERTO[r.dataset.i]=true});visibles()};
    $('ceT').onclick=function(){ABIERTO={0:true};visibles()}}
}
function lista(L){
  var h='<p class="h1">Inventario de discos</p><input class="buscar" id="q" type="search" placeholder="Buscar por número, nombre o contenido"><div class="lista" id="l"></div>';
  $('m').innerHTML=h;
  function pinta(){var q=$('q').value.trim().toLowerCase();$('l').innerHTML=L.filter(function(o){return !q||(o.id+' '+o.nombre+' '+(o.contenido||'')).toLowerCase().indexOf(q)>=0}).map(function(o){
    return '<a href="./?'+o.id.replace(/\D/g,'')+'"><span class="i">'+esc(o.id)+'</span><span class="t"><b>'+esc(o.nombre||'(sin nombre)')+'</b><span>'+esc(o.contenido||'')+'</span></span><span class="c">'+(o.total?gb(o.total):'')+'</span></a>'}).join('')||'<p class="msg">Sin resultados.</p>'}
  $('q').addEventListener('input',pinta);pinta();
}
(async function(){
  var q=decodeURIComponent((location.search||'').slice(1)+(location.hash||'').slice(1)),id=idDe(q);

    catch(e){$('m').innerHTML='<p class="id">'+id+'</p><p class="msg">Este disco todavía no tiene su página publicada. Abriendo la ficha…</p><a class="btn" href="'+pdf(id)+'">Abrir ficha completa (PDF)</a><p class="nota">La ficha PDF se abre con cuenta UDD.</p>';setTimeout(function(){location.replace(pdf(id))},1500)}
